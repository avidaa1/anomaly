<style>
:root{
  --desk:#100f0c; --desk-line:rgba(255,255,255,.05);
  --paper:#e6dfc4; --paper-shadow:#d4cba4; --ink:#211d16; --ink-dim:#5c5540;
  --redact:#0c0b09; --stamp-red:#a3241d; --stamp-blue:#1f4a68; --stamp-green:#3d6b4a;
  --stamp-amber:#a9781f; --stamp-purple:#5c4270; --accent:#2f6e63;
  --line:rgba(33,29,22,.28); --band:#0a0a08;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--desk);color:var(--ink);overflow-x:hidden;}
body{font-family:'IBM Plex Mono',monospace; font-size:.95rem; line-height:1.6;}
h1,h2,h3,.stamp,.tab,#logo,#back-home{font-family:'Special Elite',monospace;}
a{color:var(--accent);}
img,svg{max-width:100%;height:auto;}

#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;}

/* classification banners -- full-bleed, top and bottom, like a real declassified scan */
.classband{
  position:relative; z-index:12; background:var(--band); color:#e8e4d4;
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.62rem; letter-spacing:2.5px;
  text-align:center; padding:5px 8px; text-transform:uppercase; border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08);
}
.classband.top{border-top:none;}

#hud-stack{position:relative;z-index:10;padding:18px 16px 4px;}
#top-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px; max-width:900px; margin:0 auto;}
#logo{font-size:clamp(1.05rem,3.2vw,1.5rem);color:var(--paper);letter-spacing:1px;}
#logo span{color:#8fae9e;}
#back-home{
  font-weight:700;text-decoration:none;-webkit-appearance:none;appearance:none;white-space:nowrap;
  background:linear-gradient(90deg,#ff0080,#ff8c00,#ffe000,#00ff80,#00bfff,#a855f7,#ff0080);
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:rainbow 3s linear infinite; font-size:1rem;
}
@keyframes rainbow{to{background-position:300% center}}
@media (prefers-reduced-motion:reduce){#back-home{animation:none}}

/* nav = folder tabs, overlapping trapezoids, like dividers in a case-file box */
.navrow{display:flex;flex-wrap:wrap;gap:0;height:auto;align-items:flex-end;justify-content:flex-start;padding:14px 0 0; max-width:900px; margin:0 auto;}
.tab{
  -webkit-appearance:none;appearance:none;white-space:nowrap;cursor:pointer;
  background:#2a2820; border:1px solid rgba(230,223,196,.18); border-bottom:none; color:#a39d84;
  font-size:clamp(.6rem,1.5vw,.72rem); padding:8px clamp(10px,2.2vw,16px) 7px; letter-spacing:.5px;
  clip-path:polygon(6% 0, 94% 0, 100% 100%, 0% 100%);
  margin-right:-6px; position:relative; top:2px;
}
.tab:hover{color:var(--paper);}
.tab.active{color:var(--ink); background:var(--paper); border-color:var(--paper); top:0; z-index:2;}

main{position:relative;z-index:5;max-width:900px;margin:0 auto;padding:0 18px 60px;}
.section{display:none;}
.section.active{display:block;}

/* document sheet -- paper, torn/uneven top edge, sits on the dark desk with real shadow */
.card{
  background:var(--paper); color:var(--ink); border:1px solid var(--paper-shadow);
  padding:20px 22px; margin:0 0 3px; position:relative;
  box-shadow:0 10px 22px -8px rgba(0,0,0,.55);
}
.card + .card{ margin-top:14px; }
.card::before{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.018) 0px, rgba(0,0,0,.018) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse at top left, rgba(0,0,0,.06), transparent 60%);
}
h1{font-size:clamp(1.5rem,4.2vw,2.3rem); color:var(--ink); margin:6px 0 6px; letter-spacing:.5px;}
h2{font-size:clamp(1.05rem,3vw,1.35rem); color:var(--ink); margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid var(--ink); display:inline-block;}
h3{font-size:1rem; color:var(--ink); margin:0 0 6px;}
p{color:var(--ink-dim);}
.dim{color:var(--ink-dim);}

/* case-file cover sheet -- the signature element */
.cover-sheet{position:relative; padding-top:34px;}
.cover-meta{display:flex; justify-content:space-between; font-size:.68rem; letter-spacing:1px; color:var(--ink-dim); text-transform:uppercase; border-bottom:1px dashed var(--line); padding-bottom:10px; margin-bottom:14px;}
.cover-stamp{
  position:absolute; top:6px; right:18px; transform:rotate(-9deg);
  border:3px solid var(--stamp-red); color:var(--stamp-red); font-family:'Special Elite',monospace;
  font-size:1.05rem; letter-spacing:3px; padding:6px 14px; opacity:.82; text-transform:uppercase;
  filter:url(#roughen);
}

.stamp{
  display:inline-block; font-family:'Special Elite',monospace; font-size:.7rem; letter-spacing:1.5px;
  padding:3px 9px; border:2px solid currentColor; border-radius:2px; transform:rotate(-2.5deg);
  text-transform:uppercase; margin:2px 4px 2px 0; filter:url(#roughen);
}
.stamp.official{color:var(--stamp-green);}
.stamp.reported{color:var(--stamp-amber);}
.stamp.disputed{color:#a1541f;}
.stamp.unproven{color:var(--stamp-red);}
.stamp.commentary{color:var(--stamp-blue);}
.stamp.testimony{color:var(--stamp-purple);}

.redact{background:var(--redact); color:var(--redact); border-radius:1px; padding:0 4px; user-select:none;}

.legend{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 4px;font-size:.78rem;}
.status-legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.72rem;color:var(--ink-dim);margin:10px 0 2px;}

.timeline-item{border-left:2px solid var(--line); padding:2px 0 4px 16px; margin:0 0 16px 4px; position:relative;}
.timeline-item::before{content:'';position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);}
.timeline-date{color:var(--accent); font-weight:700; font-size:.82rem;}

@media (max-width:600px){
  #hud-stack{padding:14px 12px 4px;}
  main{padding:0 12px 50px;}
  .card{padding:15px 15px;}
  .cover-stamp{position:static; display:inline-block; margin-bottom:10px; transform:rotate(-4deg);}
  .cover-sheet{padding-top:6px;}
  /* Same root cause as the earlier COSMOS mobile fix: with 11 tabs now (up from 7 at launch),
     flex-wrap stacks the nav into several cluttered rows on a narrow phone screen. Fix: a
     single-line horizontal-scroll strip instead of wrapping. */
  .navrow{
    flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; justify-content:flex-start;
  }
  .navrow::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 auto; }
  table{ font-size:.72rem; }
}

/* Recovered Artifact 7-Alpha -- CSS-only 3D cube, no library.
   Rotation/pulse are driven from JS via requestAnimationFrame (see artifactTick below), NOT
   CSS `animation-duration` tied to a live custom property -- that was the original bug:
   changing --artifact-energy every ~2s (the decay tick) restarted the CSS animation from 0%
   every time, so it never completed a smooth loop. Color/glow below are NOT animations, just
   instantly-recomputed static values, so those are safe to drive from the custom property. */
.artifact-stage{
  --artifact-energy:0;
  perspective:600px; width:130px; height:130px; margin:8px auto 4px; position:relative; cursor:pointer;
}
.artifact-cube{
  width:100%; height:100%; position:absolute; inset:0; transform-style:preserve-3d;
}
.artifact-face{
  position:absolute; width:130px; height:130px;
  border:1px solid color-mix(in srgb, var(--stamp-green) calc(40% + var(--artifact-energy) * 60%), var(--stamp-red) calc(var(--artifact-energy) * 60%));
  background:rgba(61,107,74,calc(.05 + var(--artifact-energy) * .12));
  display:flex; align-items:center; justify-content:center; font-family:'Special Elite',monospace; font-size:1.6rem; color:var(--stamp-green);
}
.artifact-face.front{ transform:translateZ(65px); }
.artifact-face.back{ transform:rotateY(180deg) translateZ(65px); }
.artifact-face.right{ transform:rotateY(90deg) translateZ(65px); }
.artifact-face.left{ transform:rotateY(-90deg) translateZ(65px); }
.artifact-face.top{ transform:rotateX(90deg) translateZ(65px); }
.artifact-face.bottom{ transform:rotateX(-90deg) translateZ(65px); }
.artifact-core{
  position:absolute; inset:0; margin:auto; width:34px; height:34px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, #fff, color-mix(in srgb, var(--stamp-green) calc(70% - var(--artifact-energy) * 60%), var(--stamp-red) calc(var(--artifact-energy) * 60% + 10%)));
  box-shadow:0 0 calc(10px + var(--artifact-energy) * 30px) color-mix(in srgb, var(--stamp-green) calc(70% - var(--artifact-energy) * 50%), var(--stamp-red) calc(var(--artifact-energy) * 50%));
}

#anom-chat-toggle{
  position:fixed; bottom:16px; right:16px; z-index:60; width:54px; height:54px; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #4a8f7f, #16241e); border:2px solid rgba(230,223,196,.4); cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.5); font-size:1.4rem; color:#e6dfc4;
}

function renderGroups(){
  var html = '<div class="card"><h2>Groups &amp; Organizations</h2>'+
    '<p class="dim">Nonprofit, commercial, and academic-affiliated bodies organized around UAP/extraterrestrial-life questions. These are organizations with a stated mission, not agency findings or individual testimony, so they aren\'t run through the Official/Testimony/Reported stamp system used elsewhere on this page -- a "type" (nonprofit, commercial, academic) is the honest description here. Genuinely official bodies like AARO (U.S.) and CEFAA (Chile) already appear elsewhere on this page under Official.</p></div>';
  GROUPS.forEach(function(g){

}

var SECTIONS = {
  briefing: renderBriefing, timeline: renderTimeline, government: renderGovernment,
  science: renderScience, instruments: renderInstruments, archive: renderArchive,
  contactfolklore: renderContactFolklore, groups: renderGroups, foia: renderFOIA, commentary: renderCommentary, fieldnotes: renderFieldNotes

function showSection(name){
  var main = document.getElementById('main-content');
  main.innerHTML = SECTIONS[name]();
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-sec')===name); });
  if (name === 'briefing') artifactApply();
  if (name === 'instruments') initInstruments();
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){ showSection(t.getAttribute('data-sec')); });
});

/* ============ INSTRUMENTS BENCH -- 25 distinct offline, rule-based/procedural, interactive tools ============
   Every tool here does real (if simple) computation or lookup driven by user input -- no
   API, no network, no key. None are decorative; each responds to something the visitor
   types, drags, or clicks. Registry-driven so the footer AI_FEATURES count and the card
   grid both stay in sync with what actually exists -- add a tool here, it appears everywhere. */
var TOOLS = [];
function tool(id, name, blurb, render){ TOOLS.push({id:id, name:name, blurb:blurb, render:render}); }

tool('drake', 'Drake Equation Estimator', 'Estimate detectable civilizations in the galaxy.', function(el){
  var fields = [
    {k:'rstar', label:'R* -- new stars/year', min:0.1, max:20, step:0.1, v:1.5},
    {k:'fp', label:'fp -- fraction with planets', min:0, max:1, step:0.05, v:1.0},
    {k:'ne', label:'ne -- habitable planets/system', min:0, max:5, step:0.1, v:0.4},
    {k:'fl', label:'fl -- fraction where life develops', min:0, max:1, step:0.01, v:0.5},
    {k:'fi', label:'fi -- fraction developing intelligence', min:0, max:1, step:0.01, v:0.2},
    {k:'fc', label:'fc -- fraction releasing signals', min:0, max:1, step:0.01, v:0.5},
    {k:'L', label:'L -- years broadcasting', min:1, max:1000000, step:1, v:1000}
  ];
  el.innerHTML = fields.map(function(f){
    return '<div style="margin:8px 0;"><label class="dim" style="display:flex;justify-content:space-between;font-size:.76rem;">'+escHtml(f.label)+' <b id="t-'+f.k+'-v">'+f.v+'</b></label><input type="range" id="t-'+f.k+'" min="'+f.min+'" max="'+f.max+'" step="'+f.step+'" value="'+f.v+'" style="width:100%;"></div>';
  }).join('') + '<div id="t-drake-out" style="margin-top:8px;font-weight:600;"></div>';
  function recompute(){
    var vals = {};
    fields.forEach(function(f){ vals[f.k] = parseFloat(document.getElementById('t-'+f.k).value); document.getElementById('t-'+f.k+'-v').textContent = vals[f.k]; });
    var N = vals.rstar*vals.fp*vals.ne*vals.fl*vals.fi*vals.fc*vals.L;
    document.getElementById('t-drake-out').textContent = 'N \u2248 ' + (N<0.01?N.toExponential(2):N.toFixed(2));
  }
  fields.forEach(function(f){ document.getElementById('t-'+f.k).addEventListener('input', recompute); });
  recompute();
});

tool('kardashev', 'Kardashev Scale Calculator', 'Civilization energy use -> Type 0-III score.', function(el){
  el.innerHTML = '<label class="dim" style="font-size:.76rem;">Energy use (watts, log scale) <b id="t-kw-v"></b></label>'+
    '<input type="range" id="t-kw" min="6" max="40" step="0.1" value="20" style="width:100%;">'+
    '<div id="t-k-out" style="margin-top:8px;font-weight:600;"></div>';
  function recompute(){
    var logP = parseFloat(document.getElementById('t-kw').value);
    document.getElementById('t-kw-v').textContent = '10^'+logP+' W';
    var K = (logP - 6) / 10; /* Sagan formalization: K=(log10(P)-6)/10 */
    var label = K<1?'Sub-Type I (current human civilization: ~0.73)':K<2?'Type I -- harnesses a planet\'s energy':K<3?'Type II -- harnesses a star\'s energy':'Type III -- harnesses a galaxy\'s energy';
    document.getElementById('t-k-out').textContent = 'K = ' + K.toFixed(2) + ' -- ' + label;
  }
  document.getElementById('t-kw').addEventListener('input', recompute); recompute();
});

  var steps = [
    {k:'abio', label:'Abiogenesis (life begins at all)', v:0.5},
    {k:'multi', label:'Simple -> complex/multicellular life', v:0.3},
    {k:'intel', label:'Complex life -> intelligence', v:0.1},
    {k:'tech', label:'Intelligence -> detectable technology', v:0.5},
    {k:'survive', label:'Technological civilization survives long', v:0.2}
  ];
  el.innerHTML = steps.map(function(s){
    return '<div style="margin:6px 0;"><label class="dim" style="display:flex;justify-content:space-between;font-size:.76rem;">'+escHtml(s.label)+' <b id="t-gf-'+s.k+'-v">'+s.v+'</b></label><input type="range" id="t-gf-'+s.k+'" min="0.01" max="0.99" step="0.01" value="'+s.v+'" style="width:100%;"></div>';
  }).join('') + '<div id="t-gf-out" style="margin-top:8px;font-weight:600;"></div>';

  }
  steps.forEach(function(s){ document.getElementById('t-gf-'+s.k).addEventListener('input', recompute); });

tool('habitability', 'Exoplanet Habitability Index', 'Radius + orbit + star luminosity -> habitable-zone check.', function(el){
  el.innerHTML =
    '<label class="dim" style="font-size:.76rem;">Orbital distance (AU) <b id="t-hz-a-v"></b></label><input type="range" id="t-hz-a" min="0.1" max="5" step="0.05" value="1" style="width:100%;">'+
    '<label class="dim" style="font-size:.76rem;">Star luminosity (relative to Sun) <b id="t-hz-l-v"></b></label><input type="range" id="t-hz-l" min="0.01" max="10" step="0.01" value="1" style="width:100%;">'+
    '<div id="t-hz-out" style="margin-top:8px;font-weight:600;"></div>';
  function recompute(){
    var a = parseFloat(document.getElementById('t-hz-a').value); document.getElementById('t-hz-a-v').textContent = a+' AU';
    var L = parseFloat(document.getElementById('t-hz-l').value); document.getElementById('t-hz-l-v').textContent = L+'x Sun';
    var inner = Math.sqrt(L/1.1), outer = Math.sqrt(L/0.53); /* standard conservative HZ approximation */
    var teq = (278 * Math.pow(L,0.25) / Math.sqrt(a)).toFixed(0); /* rough equilibrium temp in K, no greenhouse */
    var inZone = a >= inner && a <= outer;
    document.getElementById('t-hz-out').textContent = 'Habitable zone: '+inner.toFixed(2)+'-'+outer.toFixed(2)+' AU. This orbit is ' + (inZone?'INSIDE':'outside') + ' it. Rough equilibrium temp: '+teq+' K.';
  }
  document.getElementById('t-hz-a').addEventListener('input', recompute);
  document.getElementById('t-hz-l').addEventListener('input', recompute);
  recompute();
});

tool('arecibo', 'Arecibo-style Message Encoder', 'Type text -- see it as a binary pixel grid, like the 1974 message.', function(el){
  el.innerHTML = '<input type="text" id="t-ar-in" maxlength="40" placeholder="Type a short message" style="width:100%;padding:8px;font-family:inherit;">'+
    '<canvas id="t-ar-canvas" width="320" height="120" style="width:100%;background:#000;margin-top:8px;"></canvas>';
  var canvas = document.getElementById('t-ar-canvas'), ctx = canvas.getContext('2d');
  function draw(){
    var text = document.getElementById('t-ar-in').value || 'ANOMALY';
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var cols = 32, rows = Math.ceil(text.length/ (cols/8)) || 4;
    var cell = canvas.width/cols;
    for (var i=0;i<text.length;i++){
      var code = text.charCodeAt(i);
      for (var bit=0; bit<8; bit++){
        var on = (code >> (7-bit)) & 1;
        var col = (i*8+bit) % cols;
        var row = Math.floor((i*8+bit)/cols);
        if (row*cell > canvas.height) break;
        ctx.fillStyle = on ? '#e6dfc4' : '#241f18';
        ctx.fillRect(col*cell, row*cell, cell-1, cell-1);
      }
    }
  }
  document.getElementById('t-ar-in').addEventListener('input', draw); draw();
});

    '<label class="dim" style="font-size:.76rem;">Distance (light-years) <b id="t-sn-d-v"></b></label><input type="range" id="t-sn-d" min="1" max="10000" value="100" style="width:100%;">'+
    '<label class="dim" style="font-size:.76rem;">Receiver dish diameter (m) <b id="t-sn-r-v"></b></label><input type="range" id="t-sn-r" min="10" max="500" value="100" style="width:100%;">'+

tool('trend', 'AARO Report Trend Analyzer', 'Auto-computed stats from this page\'s own Timeline data.', function(el){
  el.innerHTML = '<select id="t-tr-filter" style="width:100%;padding:6px;"><option value="all">All entries</option><option value="official">Official only</option><option value="reported">Reported only</option></select>'+
    '<div id="t-tr-out" style="margin-top:8px;"></div>';
  function recompute(){
    var f = document.getElementById('t-tr-filter').value;
    var subset = f==='all' ? TIMELINE : TIMELINE.filter(function(t){ return t.status===f; });
    var byDecade = {};
    subset.forEach(function(t){ var y = parseInt(t.date,10); var d = Math.floor(y/10)*10; byDecade[d] = (byDecade[d]||0)+1; });
    var out = Object.keys(byDecade).sort().map(function(d){ return d+'s: '+byDecade[d]+' '+'\u2588'.repeat(byDecade[d]); }).join('<br>');
    document.getElementById('t-tr-out').innerHTML = '<div style="font-family:monospace;font-size:.78rem;">'+out+'</div>';
  }
  document.getElementById('t-tr-filter').addEventListener('change', recompute); recompute();
});

/* ============ RECOVERED ARTIFACT 7-ALPHA -- reacts to real page activity, not decorative ============
   FIXED (2026-08-16): rotation/pulse used to be CSS `animation-duration: calc(...var...)`.
   Changing --artifact-energy (every ~2s from decay, or on click) made most browsers restart
   that CSS animation from 0% every time -- so it never completed a smooth loop, just kept
   snapping back partway through. Fix: drive rotation/pulse from a single continuous
   requestAnimationFrame loop that ACCUMULATES phase every frame (rotationAngle += rate*dt),
   never resets it, and only changes how fast the phase accumulates when energy changes --
   which is what "loop that speeds up smoothly" actually requires. */
var artifactEnergy = 0;
var artifactClicks = 0;
var artifactRotationDeg = 15; /* tilt matches the old CSS keyframe's rotateX(15deg) start */
var artifactRotationY = 0;
var artifactPulsePhase = 0;
var artifactFlashDecay = 0; /* extra brief glow boost on click/react, decays each frame */
var artifactLastTick = null;
var ARTIFACT_RUNES = ['\u25CB','\u25B3','\u25C7','\u2318','\u2317','\u29C8'];
var artifactReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function artifactApply(){
  var stage = document.getElementById('artifact-stage');
  if (!stage) return;
  stage.style.setProperty('--artifact-energy', artifactEnergy.toFixed(3));
  var status = document.getElementById('artifact-status');
  if (status){
    var label = artifactEnergy > 0.7 ? 'Highly active -- sustained resonance detected' :
      artifactEnergy > 0.35 ? 'Active -- responding to recent activity' :
      artifactEnergy > 0.05 ? 'Stirring' : 'Dormant. No recorded activity yet.';
    status.textContent = label + (artifactClicks ? (' -- ' + artifactClicks + ' direct contact' + (artifactClicks===1?'':'s')) : '');
  }
}
function artifactReact(boost){
  artifactEnergy = Math.min(1, artifactEnergy + boost);
  artifactFlashDecay = 1;
  artifactApply();
}
setInterval(function(){
  artifactEnergy = Math.max(0, artifactEnergy - 0.03);
  artifactApply();
}, 2000);
document.addEventListener('click', function(e){
  var stage = e.target.closest && e.target.closest('#artifact-stage');
  if (!stage) return;
  artifactClicks++;
  artifactReact(0.28);
  var face = document.getElementById('artifact-face');
  if (face) face.textContent = ARTIFACT_RUNES[artifactClicks % ARTIFACT_RUNES.length];
  logSessionEvent('Artifact 7-Alpha: direct contact registered (energy ' + Math.round(artifactEnergy*100) + '%)');
});

function artifactTick(now){
  requestAnimationFrame(artifactTick);
  if (artifactLastTick === null) artifactLastTick = now;
  var dt = Math.min(0.1, (now - artifactLastTick) / 1000); /* seconds, clamped so a tab switch doesn't jump */
  artifactLastTick = now;
  var cube = document.getElementById('artifact-cube');
  var core = document.getElementById('artifact-core');
  if (!cube && !core) return; /* not on the Briefing tab right now -- state still accumulates, just not rendered */

  if (!artifactReducedMotion){
    var rotSpeed = 22.5 + artifactEnergy * 45; /* deg/sec: faster spin at higher energy */
    artifactRotationY = (artifactRotationY + rotSpeed * dt) % 360;
    if (cube) cube.style.transform = 'rotateX(' + artifactRotationDeg + 'deg) rotateY(' + artifactRotationY + 'deg)';

    var pulseRate = 0.55 + artifactEnergy * 1.15; /* cycles/sec */
    artifactPulsePhase = (artifactPulsePhase + pulseRate * dt) % 1;
    var s = Math.sin(artifactPulsePhase * Math.PI * 2);
    if (core) core.style.transform = 'scale(' + (0.8 + 0.35 * (0.5 + 0.5*s)) + ')';
    if (core) core.style.opacity = (0.45 + 0.55 * (0.5 + 0.5*s)).toFixed(3);
  }

  if (artifactFlashDecay > 0){
    artifactFlashDecay = Math.max(0, artifactFlashDecay - dt*4);
    if (core) core.style.filter = 'brightness(' + (1 + artifactFlashDecay*1.4) + ')';
  } else if (core){
    core.style.filter = '';
  }
}
requestAnimationFrame(artifactTick);

showSection('briefing');

/* ============ AI-DRIVEN AMBIENT BACKGROUND: radar sweep + starfield with anomaly blips ============
   Topic-themed generative canvas (offline, no API): a slow-rotating radar sweep over a drifting
   starfield, with occasional unexplained "blips" that fade in/out at random -- most fade away
   uneventfully (the vast majority of real UAP reports resolve to conventional causes), a rare
   few persist a little longer before fading (echoing the small unresolved fraction). Nothing
   here is a data visualization of the real case counts above; it is deliberately just mood. */
var bgCanvas = document.getElementById('bg-canvas');
var bgCtx = bgCanvas.getContext('2d');
var pageVisible = true;
document.addEventListener('visibilitychange', function(){ pageVisible = !document.hidden; });
function resizeBg(){ bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeBg);
resizeBg();

var stars = [];
(function initStars(){
  var count = Math.floor((bgCanvas.width*bgCanvas.height)/9000);
  for (var i=0;i<count;i++){
    stars.push({ x:Math.random()*bgCanvas.width, y:Math.random()*bgCanvas.height, r:Math.random()*1.3+0.3, tw:Math.random()*Math.PI*2 });
  }
})();
var blips = [];
var sweepAngle = 0;
function spawnBlip(){
  var cx = bgCanvas.width/2, cy = bgCanvas.height/2;
  var maxR = Math.min(bgCanvas.width,bgCanvas.height)*0.46;
  var ang = Math.random()*Math.PI*2, dist = Math.random()*maxR;
  blips.push({ x:cx+Math.cos(ang)*dist, y:cy+Math.sin(ang)*dist, life:0, maxLife: Math.random()<0.12 ? (240+Math.random()*300) : (40+Math.random()*60) });
}
var lastSpawn = 0;
function drawBg(t){
  if (!pageVisible){ requestAnimationFrame(drawBg); return; }
  var W = bgCanvas.width, H = bgCanvas.height, cx = W/2, cy = H/2;
  bgCtx.clearRect(0,0,W,H);
  stars.forEach(function(s){
    var tw = 0.55 + 0.45*Math.sin(t*0.001 + s.tw);
    bgCtx.fillStyle = 'rgba(200,220,210,'+(0.5*tw)+')';
    bgCtx.beginPath(); bgCtx.arc(s.x,s.y,s.r,0,Math.PI*2); bgCtx.fill();
  });
  var maxR = Math.min(W,H)*0.46;
  bgCtx.strokeStyle = 'rgba(109,255,184,0.16)';
  bgCtx.lineWidth = 1;
  [0.25,0.5,0.75,1].forEach(function(f){ bgCtx.beginPath(); bgCtx.arc(cx,cy,maxR*f,0,Math.PI*2); bgCtx.stroke(); });
  sweepAngle += 0.006;
  var grad = bgCtx.createConicGradient ? bgCtx.createConicGradient(sweepAngle - Math.PI/2, cx, cy) : null;
  if (grad){
    grad.addColorStop(0, 'rgba(109,255,184,0.22)');
    grad.addColorStop(0.06, 'rgba(109,255,184,0.0)');
    grad.addColorStop(1, 'rgba(109,255,184,0.0)');
    bgCtx.fillStyle = grad;
    bgCtx.beginPath(); bgCtx.moveTo(cx,cy); bgCtx.arc(cx,cy,maxR,0,Math.PI*2); bgCtx.fill();
  }
  if (t - lastSpawn > 900 + Math.random()*1400){ spawnBlip(); lastSpawn = t; }
  blips = blips.filter(function(b){ return b.life < b.maxLife; });
  blips.forEach(function(b){
    b.life++;
    var f = b.life/b.maxLife;
    var alpha = Math.sin(f*Math.PI);
    var isPersistent = b.maxLife > 200;
    bgCtx.fillStyle = isPersistent ? 'rgba(212,160,23,'+(alpha*0.9)+')' : 'rgba(109,255,184,'+(alpha*0.7)+')';
    bgCtx.beginPath(); bgCtx.arc(b.x,b.y,isPersistent?3:2,0,Math.PI*2); bgCtx.fill();
  });
  requestAnimationFrame(drawBg);
}
requestAnimationFrame(drawBg);
